[package]
name = "glox-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI & Terminal Output
clap = { version = "4.5", features = ["derive", "env"] }
tabled = "0.16"

# Async Runtime & Pure-Rust Networking (Termux-friendly)
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Local-First Embedded Storage & Hashing
redb = "2.1"
blake3 = "1.5"

# Serialization & Markdown Parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.12"
anyhow = "1.0"
